<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Ícono: la A-atril de la identidad 3.0 (antes se cargaba el logo de Base44 desde base44.com). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/atril-512.png" />
    <!-- Sin user-scalable=no ni maximum-scale: bloquear el zoom es un problema de accesibilidad.
         El zoom de iOS al tocar un campo se evita con campos de 16px (index.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Color de la barra de estado; applyTheme() lo actualiza al cambiar entre claro y oscuro. -->
    <meta name="theme-color" content="#111113" />
    <link rel="manifest" href="/manifest.json" />
    <title>Atril</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
